name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm install

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore persistent signing key (same key every build → updates install cleanly)
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download 3D engine files (bundled into the app, so it works fully offline)
        run: |
          mkdir -p www/vendor
          curl -sSL -o www/vendor/three.min.js https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js
          curl -sSL -o www/vendor/OrbitControls.js https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js
          curl -sSL -o www/vendor/TransformControls.js https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js
          curl -sSL -o www/vendor/fflate.js https://cdn.jsdelivr.net/npm/fflate@0.6.9/umd/index.js
          curl -sSL -o www/vendor/FBXLoader.js https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js
          curl -sSL -o www/vendor/GLTFLoader.js https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js
          curl -sSL -o www/vendor/OBJLoader.js https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js
          curl -sSL -o www/vendor/GLTFExporter.js https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js
          curl -sSL -o www/vendor/OBJExporter.js https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/OBJExporter.js
          curl -sSL -o www/vendor/BufferGeometryUtils.js https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js
          curl -sSL -o www/vendor/SimplifyModifier.js https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/modifiers/SimplifyModifier.js
          ls -la www/vendor

      - name: Add Android platform (first time only, safe to repeat)
        run: npx cap add android || npx cap sync android

      - name: Replace default app icon with Forge Studio logo
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#16171a' --iconBackgroundColorDark '#16171a'

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Verify Filesystem/Share plugins actually synced into the native project
        run: |
          set -e
          echo "---- capacitor.plugins.json (what the native Bridge reads at runtime) ----"
          cat android/app/src/main/assets/capacitor.plugins.json || { echo "::error::capacitor.plugins.json not found — cap sync did not run correctly."; exit 1; }
          echo ""
          echo "---- capacitor.settings.gradle (what actually gets compiled into the APK) ----"
          cat android/capacitor.settings.gradle || { echo "::error::capacitor.settings.gradle not found."; exit 1; }
          echo ""
          # Checking capacitor.plugins.json alone isn't enough — a previous version of this check
          # only grepped the text output of `npx cap ls`, which matched even when the plugin was
          # merely *detected* in node_modules but never actually wired into the native Android
          # build. These two files are the real source of truth: capacitor.plugins.json is what
          # the Bridge reads to instantiate plugins at runtime, and capacitor.settings.gradle is
          # what tells Gradle to actually compile the plugin's native code into the APK at all. If
          # either is missing the plugin, Capacitor.Plugins.Filesystem will be undefined on-device
          # even though the build "succeeds".
          if ! grep -q "FilesystemPlugin\|capacitor-filesystem" android/app/src/main/assets/capacitor.plugins.json; then
            echo "::error::Filesystem is missing from capacitor.plugins.json — Capacitor.Plugins.Filesystem WILL be undefined at runtime. Export/save will silently fail."
            exit 1
          fi
          if ! grep -q "SharePlugin\|capacitor-share" android/app/src/main/assets/capacitor.plugins.json; then
            echo "::error::Share is missing from capacitor.plugins.json — Capacitor.Plugins.Share WILL be undefined at runtime."
            exit 1
          fi
          if ! grep -q "capacitor-filesystem" android/capacitor.settings.gradle; then
            echo "::error::capacitor-filesystem is not included in capacitor.settings.gradle — its native code was never compiled into the APK."
            exit 1
          fi
          if ! grep -q "capacitor-share" android/capacitor.settings.gradle; then
            echo "::error::capacitor-share is not included in capacitor.settings.gradle — its native code was never compiled into the APK."
            exit 1
          fi
          echo "Filesystem and Share are both properly wired into the native Android project."

      - name: Add AdMob App ID to AndroidManifest.xml
        run: |
          python3 - <<'PYEOF'
          import re
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path) as f:
              content = f.read()
          meta = '        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-6842986503191598~6035640863"/>\n'
          if 'com.google.android.gms.ads.APPLICATION_ID' not in content:
              content = re.sub(r'(<application[^>]*>)', r'\1\n' + meta, content, count=1)
          with open(path, 'w') as f:
              f.write(content)
          print("AndroidManifest.xml patched")
          PYEOF

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: forge-studio-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
